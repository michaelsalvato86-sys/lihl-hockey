; NOT TESTED IN UNREAL (the engine is not installed on the authoring PC). Recommended starting settings for an RX 6900 XT (RDNA2, 16 GB, DX12 SM6).
; Names below are the UE 5.x settings as remembered; TODO(verify in editor Project Settings): any key the editor rewrites or rejects.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/L_RinkPOC
EditorStartupMap=/Game/Maps/L_RinkPOC
GlobalDefaultGameMode=/Script/LIHL_UE5_HOCKEY_POC.LihlGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; Lumen hardware RT needs SM6 DX12. The 6900 XT supports DXR 1.1 but RT is much slower than on RTX; start with software Lumen.
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; Global illumination: 1 = Lumen
r.DynamicGlobalIlluminationMethod=1
; Reflections: 1 = Lumen
r.ReflectionMethod=1
; Shadows: 2 = Virtual Shadow Maps
r.Shadow.Virtual.Enable=1
; Lumen software tracing (distance fields / mesh SDF). Toggle to 1 to try hardware RT on the 6900 XT (compare frame time).
r.Lumen.HardwareRayTracing=0
r.GenerateMeshDistanceFields=True
; Nanite on for static rink and crowd meshes. Skeletal skater meshes are NOT Nanite (UE 5.x skeletal Nanite is experimental/partial).
r.Nanite.ProjectEnabled=True
; Anti-aliasing: 4 = TSR (temporal super resolution). Screen percentage via r.ScreenPercentage in scalability groups.
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=1
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.AllowStaticLighting=False
r.SupportSkyAtmosphereAffectsHeightFog=True
; Fixed-step physics for the puck: we substep in code, but keep the engine step sane.
[/Script/Engine.PhysicsSettings]
bSubstepping=True
bSubsteppingAsync=False
MaxSubstepDeltaTime=0.008333
MaxSubsteps=6
DefaultGravityZ=-980.0
DefaultTerminalVelocity=4000.0

[/Script/Engine.Engine]
bSmoothFrameRate=False
bUseFixedFrameRate=False
