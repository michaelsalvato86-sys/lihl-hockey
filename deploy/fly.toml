# fly.toml app configuration file generated for lihl-hockey on 2026-11-11T21:33:27-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'lihl-hockey'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  GRACE_MS = '45000'
  MAX_ROOMS = '40'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
