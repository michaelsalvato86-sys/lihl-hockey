};
const sc_={

 receive:(t,p,c,pk)=>{p.vx=14;p.vy=0;p.acc01=.2;if(t<.7){pk.x=p.x+14-t*20;pk.y=p.y-3+t*4}else{c.hasPuck=true;pk.x=p.x+4;pk.y=p.y}if(Math.abs(t-0)<.02&&!p.ae)p.ae={id:1,k:'recv',d:{}};if(t>.62&&p.ae&&p.ae.k==='recv')p.ae={id:2,k:'gain',d:{}}},
 pass:(t,p,c,pk)=>{p.vx=20;p.vy=0;p.acc01=.3;c.hasPuck=t<.02;pk.x=p.x+4;pk.y=p.y;if(t<.02&&!p.ae)p.ae={id:1,k:'pass',d:{a:-0.7}};if(t>=.02){c.hasPuck=false;pk.x+=t*60}},

 slap:(t,p,c,pk)=>{p.vx=14;p.vy=0;p.acc01=.1;c.charge=t<.5?Math.min(1,t/.45):0;c.hasPuck=t<.52;pk.x=p.x+4;pk.y=p.y;if(t>=.5&&!p.ae)p.ae={id:1,k:'shot',d:{kind:'slap',a:0}};if(t>=.52){c.hasPuck=false;pk.x+=(t-.5)*130}},
 snap:(t,p,c,pk)=>{p.vx=18;p.vy=0;p.acc01=.2;c.hasPuck=t<.02;pk.x=p.x+4;pk.y=p.y;if(t<.02&&!p.ae)p.ae={id:1,k:'shot',d:{kind:'snap',a:-0.2}};if(t>=.02){c.hasPuck=false;pk.x+=t*100}},

window.GS={

 g_lateral:(t,p)=>{p.y=Math.sin(t*2.2)*9},

 g_blocker:(t,p)=>{p.y=0;if(t<.02&&!p.ae)p.ae={id:1,k:'save',d:{kind:'blocker',side:'r',dy:-2,h:1}}},
 g_pad:(t,p)=>{p.y=0;if(t<.02&&!p.ae)p.ae={id:1,k:'save',d:{kind:'pad',side:'l',dy:3.6,h:0}}},
 g_stick:(t,p)=>{p.y=0;if(t<.02&&!p.ae)p.ae={id:1,k:'save',d:{kind:'stick',side:'r',dy:-3,h:0}}},
 g_cover:(t,p)=>{p.y=0;if(t<.02&&!p.ae)p.ae={id:1,k:'cover',d:{}}},

AT.goalieScenarios=Object.keys(GS);
AT.scenarios=Object.keys(sc_);
// run a scenario for `secs` at 60 fps; record states and metrics; leave the final pose rendered
AT.run=function(name,secs,opts){
  opts=opts||{};AT.spawn(!!opts.goalie);ANIM.debug=true;const fn=(opts.goalie&&GS[name])||sc_[name];const dt=1/60,rec={states:[],maxHandOff:0,maxBotOff:0,minBlade:9,maxBlade:-9,maxSnap:0,frames:0,seq:[]};
  let last='',prevHeel=null;const vA=new THREE.Vector3(),vB=new THREE.Vector3(),pf=[null,null],qf=new THREE.Quaternion(),qr=new THREE.Quaternion(),up=new THREE.Vector3();rec.slipSum=0;rec.slipN=0;rec.edge=[0,0];rec.edgeN=0;rec.fingerMax=0;rec.maxGrip=-9;
  for(let t=0;t<=secs+1e-6;t+=dt){AT.step(fn,t,dt);rec.frames++;const an=AT.m.an,s=an&&an.state;if(s&&s!==last){rec.seq.push(+t.toFixed(2)+':'+s);last=s}
    if(an&&an.metrics){const k=an.metrics;rec.maxHandOff=Math.max(rec.maxHandOff,k.topHandOffShaft);rec.maxBotOff=Math.max(rec.maxBotOff,k.botHandOffShaft);rec.minBlade=Math.min(rec.minBlade,k.bladeHeight);rec.maxBlade=Math.max(rec.maxBlade,k.bladeHeight);}
    if(an&&an.metrics){rec.maxGrip=Math.max(rec.maxGrip,an.metrics.gripHeight||-9);if(t>0.3&&an.metrics.fingerTop>=0)rec.fingerMax=Math.max(rec.fingerMax,an.metrics.fingerTop,an.metrics.fingerBot)}
    {const sps=Math.hypot(AT.p.vx,AT.p.vy);const ids=['foot_l','foot_r'],bl=['ball_l','ball_r'],sl=[];
     for(let i=0;i<2;i++){AT.m.byName[ids[i]].getWorldPosition(vA);AT.m.byName[bl[i]].getWorldPosition(vB);
       if(pf[i]&&sps>6&&t>0.3){const vx=(vA.x-pf[i].x)/dt,vz=(vA.z-pf[i].z)/dt,tx=vB.x-vA.x,tz=vB.z-vA.z,tl=Math.hypot(tx,tz)||1;sl.push(Math.abs(vx*(-tz/tl)+vz*(tx/tl)))}
       pf[i]=vA.clone();
       AT.m.byName[ids[i]].getWorldQuaternion(qf);AT.m.root.getWorldQuaternion(qr);qf.premultiply(qr.invert());up.set(0,1,0).applyQuaternion(SK.restW[ids[i]].clone().invert()).applyQuaternion(qf);rec.edge[i]+=up.dot(SK.Ld);}
     rec.edgeN++;if(sl.length==2){rec.slipSum+=Math.min(sl[0],sl[1]);rec.slipN++}}
    if(AT.m.stick){const h=AT.m.stick.heel.clone();if(prevHeel)rec.maxSnap=Math.max(rec.maxSnap,h.distanceTo(prevHeel));prevHeel=h}
  }
  rec.slip=rec.slipN?rec.slipSum/rec.slipN:0;rec.edgeAvg=(rec.edge[0]+rec.edge[1])/2/Math.max(1,rec.edgeN);rec.final=AT.m.an&&AT.m.an.state;AT.rec=rec;return rec;
};
// ---- automated acceptance: expected states + joint/stick assertions per scenario ----
AT.expect={stationary:['ready'],skate:['skating'],accelerate:['accelerating','sprint_skating'],glide:['gliding'],backskate:['backward_skating'],turn_left:['turning_left'],turn_right:['turning_right'],crossover:['crossover_turn'],
 stop:['stopping'],carry:['stickhandling'],protect:['protecting_puck'],receive:['receiving_pass','stickhandling'],pass:['passing'],wrist:['shot_wrist'],slap:['preparing_shot','shot_slap'],snap:['shot_snap'],onetimer:['receiving_pass','shot_onetimer'],
 checked:['getting_checked'],check:['body_check'],poke:['poke_check'],fall:['falling'],faceoff:['faceoff_stance','faceoff_draw'],pivot:['pivoting'],celebrate:['celebrating'],backhand:['shot_backhand'],backpass:['passing'],shuffle:['side_shuffle'],brace:['bracing'],lift:['stick_lift'],hit:['hit_windup','body_check'],hitmiss:['hit_windup','hit_miss'],checked_board:['getting_checked'],transition_carry_to_defend:['stickhandling']};
AT.gExpect={g_ready:['goalie_ready'],g_lateral:['goalie_shuffle','goalie_t_push'],g_tpush:['goalie_t_push'],g_butterfly:['goalie_butterfly'],g_glove:['goalie_glove_save'],g_blocker:['goalie_blocker_save'],g_pad:['goalie_pad_save'],g_stick:['goalie_stick_save'],g_cover:['goalie_cover'],g_goal:['goalie_goal_against']};

// ---- leg checks: IK reach, ice contact, pop between states, stride freeze on coast ----
const combo=(t,p,c,pk)=>{p.turn=0;p.back=false;p.acc01=0;p.vy=0;
 if(t<.8){p.vx=0}else if(t<1.6){p.vx=Math.min(30,(t-.8)*40);p.acc01=.9}else if(t<2.4){p.vx=30;p.acc01=.2}else if(t<3.2){p.vx=30-(t-2.4)*6}
 else if(t<3.6){p.vx=Math.max(0,25-(t-3.2)*90)}else if(t<4.4){p.vx=Math.min(24,(t-3.6)*30);p.acc01=.8;p.turn=(t>4)?-2.2:0}else if(t<5.4){p.vx=-12;p.back=true;p.acc01=.5}else{p.vx=Math.min(26,Math.max(-12,-12+(t-5.4)*40));p.acc01=.6;p.back=t<5.7}};
AT.legStats=function(fn,secs){
 AT.spawn(false);ANIM.debug=true;const dt=1/60,m=()=>AT.m,names=['pelvis','spine_01','spine_03','Head','thigh_l','calf_l','foot_l','thigh_r','calf_r','foot_r'],prev={},cur=new THREE.Quaternion();
 const rq=new THREE.Quaternion(),R={maxReach:0,minAnkle:9,minBall:9,maxDeg:0,worst:'',worstT:0,phA:[],t:[]},v=new THREE.Vector3();
 for(let t=0;t<=secs+1e-6;t+=dt){AT.step(fn,t,dt);const mm=m(),an=mm.an;
  if(an.legRes){R.maxReach=Math.max(R.maxReach,an.legRes.l.reach,an.legRes.r.reach)}
  mm.inner.updateMatrixWorld(true);
  for(const s of ['l','r']){mm.byName['foot_'+s].getWorldPosition(v);mm.inner.worldToLocal(v);R.minAnkle=Math.min(R.minAnkle,v.y-SK.footRestY);mm.byName['ball_'+s].getWorldPosition(v);mm.inner.worldToLocal(v);R.minBall=Math.min(R.minBall,v.y-AR.ballRestY)}
  if(t>.05)for(const n of names){mm.byName[n].getWorldQuaternion(cur);mm.root.getWorldQuaternion(rq);cur.premultiply(rq.invert());if(prev[n]){const d=2*Math.acos(Math.min(1,Math.abs(prev[n].dot(cur))))*180/Math.PI;if(d>R.maxDeg){R.maxDeg=d;R.worst=n;R.worstT=t}}(prev[n]||(prev[n]=new THREE.Quaternion())).copy(cur)}
  R.phA.push(an.ph);R.t.push(t)}
 return R};
AT.legChecks=function(chk){
 for(const n of ['skate','accelerate','backskate','crossover','stop','pivot','turn_left','glide']){const R=AT.legStats(sc_[n],1.6);chk(n+' leg IK reaches',R.maxReach<0.03,'unreached '+R.maxReach.toFixed(3));chk(n+' ankle not below ice',R.minAnkle>-0.012,R.minAnkle.toFixed(3));chk(n+' toe not below ice',R.minBall>-0.012,R.minBall.toFixed(3))}
 const C=AT.legStats(combo,6.6);AT.comboStat=C;chk('combo leg IK reaches',C.maxReach<0.03,C.maxReach.toFixed(3));chk('combo feet above ice',C.minAnkle>-0.012&&C.minBall>-0.012,C.minAnkle.toFixed(3)+' '+C.minBall.toFixed(3));
 chk('no pop between states (max joint deg/frame, 60fps)',C.maxDeg<AT.popMax,C.maxDeg.toFixed(1)+' '+C.worst+' @'+C.worstT.toFixed(2));
 const G=AT.legStats(sc_.glide,2.0),i0=Math.round(1.0*60),i1=Math.round(1.8*60);chk('stride freezes when coasting',Math.abs(G.phA[i1]-G.phA[i0])<0.08,(G.phA[i1]-G.phA[i0]).toFixed(3));
 const K=AT.legStats(sc_.skate,1.6);chk('stride runs when skating',Math.abs(K.phA[Math.round(1.5*60)]-K.phA[Math.round(.5*60)])>2.5,(K.phA[90]-K.phA[30]).toFixed(2));
 const A=AT.legStats(sc_.accelerate,1.6),Kc=AT.legStats(sc_.skate,1.6);
};
AT.popMax=12;
AT.assertAll=function(){
  const out=[];let fails=0;
  const chk=(n,ok,why)=>{out.push((ok?'PASS ':'FAIL ')+n+(ok?'':'  '+why));if(!ok)fails++};
  for(const n of AT.scenarios){const r=AT.run(n,n==='slap'?1.5:n==='fall'?2:1.4),seq=r.seq.map(s=>s.replace(/^[0-9.]+:/,''));
    const exp=AT.expect[n]||[];const missing=exp.filter(e=>!seq.includes(e));
    const freeHand=/sprint|accelerating|poke|getting|falling|celebr|crossover|hit_|shuffle|bracing|backhand|lift/.test(seq.join())||['skate','glide','crossover'].includes(n);
    const raised=/check|slap|onetimer|preparing|snap|wrist|pass|poke|falling|celebr|hit_|backhand|lift|getting/.test(seq.join());
    chk(n+' state',missing.length===0,'missing '+missing.join(',')+' got '+seq.join('>'));
    chk(n+' top hand on stick',r.maxHandOff<0.02,'off '+r.maxHandOff.toFixed(3));
    chk(n+' bottom hand on stick',freeHand||r.maxBotOff<0.2,'off '+r.maxBotOff.toFixed(2));
    chk(n+' blade at ice',raised||r.maxBlade<0.08,'blade '+r.maxBlade.toFixed(2));
    chk(n+' no stick snap',r.maxSnap<0.6,'snap '+r.maxSnap.toFixed(2)+' m/frame');
  }
  { // gap fixes: slap vs wrist, skate blades follow travel, edges bank into turns, pivot, fingers on the shaft
    const w=AT.run('wrist',1.2),s=AT.run('slap',1.5);chk('slap grip rises well above wrist grip',s.maxGrip-w.maxGrip>=0.3,'slap '+s.maxGrip.toFixed(2)+' wrist '+w.maxGrip.toFixed(2));chk('slap blade windup higher than wrist',s.maxBlade-w.maxBlade>=0.4,'slap '+s.maxBlade.toFixed(2)+' wrist '+w.maxBlade.toFixed(2));
    for(const n of ['skate','glide','accelerate','carry','turn_left','turn_right']){const r=AT.run(n,1.6);chk(n+' blade slip (ft/s, best foot)',r.slip<1.5,r.slip.toFixed(2))}
    const L=AT.run('turn_left',1.6),R=AT.run('turn_right',1.6);chk('left turn banks skates left',L.edgeAvg>0.03,'edge '+L.edgeAvg.toFixed(3));chk('right turn banks skates right',R.edgeAvg<-0.03,'edge '+R.edgeAvg.toFixed(3));
    const st=AT.run('stationary',1.0),cr=AT.run('carry',1.4);chk('fingers wrap shaft (stationary)',st.fingerMax>0&&st.fingerMax<0.07,'max '+st.fingerMax.toFixed(3));chk('fingers wrap shaft (stickhandling)',cr.fingerMax>0&&cr.fingerMax<0.07,'max '+cr.fingerMax.toFixed(3));
  }
  AT.legChecks(chk);
  for(const n of AT.goalieScenarios){const r=AT.run(n,1.4,{goalie:true}),seq=r.seq.map(s=>s.replace(/^[0-9.]+:/,''));const miss=(AT.gExpect[n]||[]).filter(e=>!seq.includes(e));chk(n+' state',miss.length===0,'missing '+miss.join(',')+' got '+seq.join('>'));chk(n+' no stick snap',r.maxSnap<0.6,r.maxSnap.toFixed(2))}
  return {fails,total:out.length,failed:out.filter(l=>l.startsWith('FAIL'))};
};
AT.view=function(v){
  const p=AT.p;const px=p.x,pz=p.y;
  if(v==='broadcast'){cam.position.set(px+4,23,pz+38);cam.lookAt(px,1.5,pz);cam.fov=36}
  else if(v==='close'){cam.position.set(px+9,5,pz+13);cam.lookAt(px+2,3,pz);cam.fov=34}
  else if(v==='side'){cam.position.set(px+2,4.5,pz+16);cam.lookAt(px+2,3.2,pz);cam.fov=30}
  else if(v==='front'){cam.position.set(px+17,4.5,pz+1);cam.lookAt(px,3.3,pz);cam.fov=32}
  else if(v==='top'){cam.position.set(px+2,26,pz+.1);cam.lookAt(px+2,0,pz);cam.fov=34}
  else if(v==='back'){cam.position.set(px-14,5,pz-4);cam.lookAt(px+2,3.3,pz);cam.fov=34}
  cam.updateProjectionMatrix();r.render(sc,cam);
};
// frame at time t of a scenario (re-simulates from 0 so the result is exact)
AT.frame=function(name,t,view,opts){AT.run(name,t,opts);AT.view(view||'close');document.getElementById('hud').textContent=name+' t='+t.toFixed(2)+'s  state='+AT.m.an.state;return AT.m.an.state};
SK.load(()=>{if(SK.failed){document.title='FAILED';return}AT.spawn(false);AT.step(sc_.stationary,0,1/60);AT.view('close');document.title='ready'});
</script></body></html>
