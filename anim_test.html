// advance the skater one frame under the scenario function
AT.step=function(fn,t,dt){

 hit:(t,p,c)=>{p.vx=22;p.vy=0;p.acc01=.4;if(t>=.1&&!p.ae)p.ae={id:1,k:'hitwind',d:{a:.5,d:9}};if(t>=.7&&p.ae.id===1)p.ae={id:2,k:'check',d:{a:.5,board:true,power:.9}}},

 checked_behind:(t,p,c)=>{p.vx=20;p.vy=0;if(t<.02&&!p.ae)p.ae={id:1,k:'checked',d:{power:.8,side:1,dir:0,from:'behind'}}},
 checked_side:(t,p,c)=>{p.vx=20;p.vy=0;if(t<.02&&!p.ae)p.ae={id:1,k:'checked',d:{power:.8,side:1,dir:Math.PI/2,from:'side'}}},
 checked_board:(t,p,c)=>{p.vx=18;p.vy=0;if(t>=.1&&!p.ae)p.ae={id:1,k:'checked',d:{power:.9,board:true,dir:Math.PI*.8,side:1}}},

// min knee flexion (rad, 0 = straight) per leg over a scenario, and pelvis lateral travel (root space, m)
AT.limbStat=function(fn,secs,t0){const v=[new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3()],dt=1/60,mn=[9,9],R={pelMin:9,pelMax:-9,pelY:[9,-9]};AT.spawn(false);ANIM.debug=true;t0=t0===undefined?.4:t0;
 for(let t=0;t<=secs+1e-6;t+=dt){AT.step(fn,t,dt);if(t<t0)continue;AT.m.inner.updateMatrixWorld(true);
  ['l','r'].forEach((s,i)=>{AR.pos(AT.m,'thigh_'+s,v[0]);AR.pos(AT.m,'calf_'+s,v[1]);AR.pos(AT.m,'foot_'+s,v[2]);const a=v[0].clone().sub(v[1]).normalize(),b=v[2].clone().sub(v[1]).normalize();mn[i]=Math.min(mn[i],Math.PI-Math.acos(Math.max(-1,Math.min(1,a.dot(b)))))});
  AR.pos(AT.m,'pelvis',v[0]);R.pelMin=Math.min(R.pelMin,v[0].x);R.pelMax=Math.max(R.pelMax,v[0].x);R.pelY=[Math.min(R.pelY[0],v[0].y-(-AT.m.root.position.y)),Math.max(R.pelY[1],v[0].y-(-AT.m.root.position.y))]}
 R.flex=mn;R.pelAmp=R.pelMax-R.pelMin;return R};
// planted foot: world xz drift while the plant is on (ft), frames planted, and min hip-to-ankle vertical drop (fraction of leg length)
AT.plantStat=function(fn,secs){AT.spawn(false);ANIM.debug=true;const dt=1/60,v=new THREE.Vector3(),H=new THREE.Vector3(),lat={l:null,r:null},R={drift:0,frames:0,minDrop:9,maxReach:0};
 for(let t=0;t<=secs+1e-6;t+=dt){AT.step(fn,t,dt);const an=AT.m.an,pl=an.plant;AT.m.g.updateMatrixWorld(true);
  for(const s of ['l','r']){AT.m.byName['foot_'+s].getWorldPosition(v);const on=pl&&pl[s].on&&an.legD[s].pw>0.7&&(!an.legRes||an.legRes[s].hold===undefined||an.legRes[s].hold>0.9);if(on){if(!lat[s])lat[s]=v.clone();else R.drift=Math.max(R.drift,Math.hypot(v.x-lat[s].x,v.z-lat[s].z));R.frames++;if(AT.p.vx>1.2)R.moving=(R.moving||0)+1}else lat[s]=null;
   if(t>.4){AR.pos(AT.m,'thigh_'+s,H);AR.pos(AT.m,'foot_'+s,v);R.minDrop=Math.min(R.minDrop,(H.y-v.y)/(AR.llen[s].l1+AR.llen[s].l2))}}

AT.view=function(v){
  const p=AT.p;const px=p.x,pz=p.y;
  if(v==='broadcast'){cam.position.set(px+4,23,pz+38);cam.lookAt(px,1.5,pz);cam.fov=36}
  else if(v==='close'){cam.position.set(px+9,5,pz+13);cam.lookAt(px+2,3,pz);cam.fov=34}
  else if(v==='side'){cam.position.set(px+2,4.5,pz+16);cam.lookAt(px+2,3.2,pz);cam.fov=30}
  else if(v==='wide'){cam.position.set(px+1,3.2,pz+20);cam.lookAt(px+1,1.6,pz);cam.fov=36}
  else if(v==='wideF'){cam.position.set(px+20,3.2,pz+1);cam.lookAt(px,1.6,pz);cam.fov=36}
  else if(v==='sidew'){cam.position.set(px+2,3.4,pz+23);cam.lookAt(px+2,2.5,pz);cam.fov=38}
  else if(v==='followw'){cam.position.set(px+12,5,pz+15);cam.lookAt(px,2.4,pz);cam.fov=36}
  else if(v==='follow'){cam.position.set(px+9,4.5,pz+11);cam.lookAt(px,2.6,pz);cam.fov=34}
  else if(v==='front'){cam.position.set(px+17,4.5,pz+1);cam.lookAt(px,3.3,pz);cam.fov=32}
  else if(v==='top'){cam.position.set(px+2,26,pz+.1);cam.lookAt(px+2,0,pz);cam.fov=34}
  else if(v==='back'){cam.position.set(px-14,5,pz-4);cam.lookAt(px+2,3.3,pz);cam.fov=34}
  cam.updateProjectionMatrix();r.render(sc,cam);
